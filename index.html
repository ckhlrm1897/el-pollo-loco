<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="shortcut icon" href="img/3_enemies_chicken/chicken_normal/1_walk/1_w.png" type="image/x-icon">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/home-screen.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken_small.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/bars/status-bar.class.js"></script>
    <script src="models/bars/health-bar.class.js"></script>
    <script src="models/bars/health-bar-endboss.class.js"></script>
    <script src="models/bars/coinBar.class.js"></script>
    <script src="models/bars/bottleBar.class.js"></script>
    <script src="level/level1.js"></script>
    <script src="/js/game.js"></script>

</head>

<body>
    <!-- 
    <h1>El pollo loco</h1> -->
    <canvas class="d_none" id="canvas" width="720px" height="480px">
        <button class="no_border" id="mute" onclick="unMute()">
            <img src="img/10_buttons/settings/mute_button.png" alt="walk_right">
        </button>
        <button class="no_border d_none" id="un-mute" onclick="unMute()">
            <img src="img/10_buttons/settings/loutspeaker_button.png" alt="walk_right">
        </button>
    </canvas>

    <div class="home_screen" id="home-screen">

        <img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="">
        <button class="no_border" onclick="fullscreen()">
            <img src="img/10_buttons/settings/fullscreen_button.png" alt="walk_left">
        </button>
        <button class="no_border">
            <img src="img/10_buttons/settings/info_button.png" alt="walk_left">
        </button>
        <button class="no_border" id="mute" onclick="unMute()">
            <img src="img/10_buttons/settings/mute_button.png" alt="walk_right">
        </button>
        <button class="no_border d_none" id="un-mute" onclick="unMute()">
            <img src="img/10_buttons/settings/loutspeaker_button.png" alt="walk_right">
        </button>
        <button class="no_border" onclick="startGame()">
            <img src="img/10_buttons/settings/play_button.png" alt="walk_right">
        </button>

        <button class="no_border run_left_btn">
            <img src="img/10_buttons/mobile_buttons/mobile_button_run.png" alt="walk_left">
        </button>
        <button class="no_border run_right_btn">
            <img class="rotate_180" src="img/10_buttons/mobile_buttons/mobile_button_run.png" alt="walk_right">
        </button>

        <button class="no_border bottle_btn">
            <img src="img/10_buttons/mobile_buttons/mobile_button_bottle.png" alt="jump">
        </button>
        <button class="no_border jump_btn">
            <img src="img/10_buttons/mobile_buttons/mobile_button_jump.png" alt="walk_left">
        </button>

    </div>
</body>

</html>
