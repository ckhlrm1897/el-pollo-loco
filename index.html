<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="shortcut icon" href="img/3_enemies_chicken/chicken_normal/1_walk/1_w.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken_small.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/bars/status-bar.class.js"></script>
    <script src="models/bars/health-bar.class.js"></script>
    <script src="models/bars/health-bar-endboss.class.js"></script>
    <script src="models/bars/coinBar.class.js"></script>
    <script src="models/bars/bottleBar.class.js"></script>
    <script src="level/level1.js"></script>


</head>

<body onload="init()">

    <h1>El pollo loco</h1>
    <img src="img/You won, you lost/Game Over.png" id="game-over" class="game_over d_none" alt="">
    <img src="img/You won, you lost/You Win A.png" id="win" class="game_over d_none" alt="">
    <div class="exit_or_restart_container">
        <div class="exit_or_restart_buttons d_flex justify_center">
            <button class="no_border restart_btn d_none" onclick="restart()" id="restart">
                <img src="img/10_buttons/restart.png" alt="play_button">
            </button>
            <button class="no_border exit_btn d_none" onclick="exit()" id="exit">
                <img src="img/10_buttons/exit.png" alt="play_button">
            </button>
        </div>
    </div>
    <canvas class="d_none" id="canvas" width="720px" height="480px"></canvas>
    <div id="mobile-btns">
        <img class="buttons mobile run_left_btn" id="left-btn" src="img/10_buttons/mobile_buttons/mobile_button_run.png"
            alt="walk_left">
        <img class="buttons mobile run_right_btn rotate_180" id="right-btn"
            src="img/10_buttons/mobile_buttons/mobile_button_run.png" alt="walk_right">
        <img class="buttons mobile bottle_btn" id="bottle-btn" src="img/10_buttons/mobile_buttons/mobile_button_bottle.png"
            alt="jump">
        <img class="buttons mobile jump_btn" id="jump-btn" src="img/10_buttons/mobile_buttons/mobile_button_jump.png"
            alt="walk_left">
    </div>

    <div class="home_screen" id="home-screen">
        <img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="">
        <a href="info.html">
            <img class="buttons info_btn" id="info" src="img/10_buttons/settings/info_button.png" alt="info_btn">
        </a>
        <img class="buttons mute_btn" id="mute" onclick="unMute()" src="img/10_buttons/settings/mute_button.png"
            alt="mute_btn">
        <img class="buttons d_none loud_btn" id="un-mute" onclick="unMute()"
            src="img/10_buttons/settings/loutspeaker_button.png" alt="loud_btn">
        <img class="buttons play_btn" onclick="startGame()" src="img/10_buttons/settings/play_button.png"
            alt="play_button">
    </div>

    <div class="rotate_overlay d_flex justify_center align_center items_center">
        <img src="img/rotate device.png" alt="rotate_device">
    </div>

    <footer id="footer">
        <a href="impressum.html">Impressum</a>
    </footer>
</body>
<script src="/js/game.js"></script>

</html>
